<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tanooki Auth</title>
  <style>
    :root { --bg:#0B0B0D; --panel:#131316; --card:#16161A; --line:#2A2A30; --line2:#3A3A42; --text:#F2F2F5; --muted:#8B8B95; --accent:#2F80FF; --green:#2BD66B; --red:#FF5A5F; }
    * { box-sizing: border-box; }
    body { margin:0; width:360px; background:var(--bg); color:var(--text); font:13px/1.4 system-ui, sans-serif; }
    header { display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--panel); }
    header b { letter-spacing:2px; font-size:13px; }
    header span { color:var(--muted); font-size:10px; letter-spacing:3px; }
    main { padding:12px 14px 14px; }
    .caps { font-size:10px; letter-spacing:1.1px; font-weight:600; color:var(--muted); text-transform:uppercase; margin:10px 2px 6px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; }
    .row { display:flex; align-items:center; gap:8px; }
    .grow { flex:1; min-width:0; }
    .title { font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sub { color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .code { font-size:20px; font-weight:700; letter-spacing:1px; font-variant-numeric:tabular-nums; }
    .left { color:var(--muted); font-size:11px; width:26px; text-align:right; }
    button { font:600 12px system-ui, sans-serif; border-radius:6px; padding:6px 10px; cursor:pointer; border:1px solid var(--line2); background:transparent; color:var(--text); }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    button:disabled { opacity:.5; cursor:default; }
    input { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line2); border-radius:6px; padding:8px 10px; font:14px system-ui, sans-serif; }
    input:focus { outline:none; border-color:var(--accent); }
    .msg { color:var(--muted); margin:6px 2px; }
    .err { color:var(--red); margin:6px 2px; }
    .pill { display:inline-block; border:1px solid rgba(43,214,107,.55); background:rgba(43,214,107,.1); border-radius:999px; padding:1px 8px; font-size:11px; }
    .list { max-height:300px; overflow-y:auto; }
    .qr { display:block; margin:10px auto; background:#fff; border-radius:8px; padding:10px; }
    .link { background:none; border:none; color:var(--accent); padding:4px 2px; font-weight:600; }
    .code-input { font-size:22px; letter-spacing:6px; text-align:center; }
  </style>
</head>
<body>
  <header><img src="icons/icon48.png" width="24" height="24" alt=""><div><b>TANOOKI</b><br><span>AUTH</span></div></header>
  <main id="main"><p class="msg">Connecting…</p></main>
  <script src="qrcode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
