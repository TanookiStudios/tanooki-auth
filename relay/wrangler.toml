# Tanooki Auth relay: sync store + phone link mailbox. Sees only ciphertext and random IDs.
# Protocol: PROTOCOL.md. Test: `node test.mjs <url>`.
# Optional push secrets (set with `npx wrangler secret put NAME`, never in this file):
#   APNS_KEY, APNS_KEY_ID, APNS_TEAM_ID   Apple push (.p8 key contents, its key ID, team ID)
#   FCM_SERVICE_ACCOUNT                   Firebase service account JSON
# Without them, /push returns 503 "push not configured" and everything else works.
name = "tanooki-auth-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
APNS_TOPIC = "com.tanookistudios.auth"
# Public half of the Premium signing key (same as worker/wrangler.toml): checks team license tokens.
LICENSE_PUBLIC = "JZ9iKjegJLat8xNt2L80HNWmHfXJc9at34lUBynULM8="
# TEST_MODE is never set here. Local tests pass it with `npx wrangler dev --var TEST_MODE:1` so the
# emergency-access wait can be shortened.

[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncGroup"

[[durable_objects.bindings]]
name = "LINK"
class_name = "LinkRoom"

[[durable_objects.bindings]]
name = "EMERGENCY"
class_name = "EmergencyGrant"

[[durable_objects.bindings]]
name = "TEAM"
class_name = "Team"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncGroup", "LinkRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["EmergencyGrant", "Team"]

# Per-IP cap on every request, checked before any Durable Object is touched.
[[ratelimits]]
name = "IP_LIMIT"
namespace_id = "7301"
simple = { limit = 300, period = 60 }
