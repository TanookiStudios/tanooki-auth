name: tanooki_cloud
description: "Tanooki Auth's own native bits for sync and the phone link: iCloud Drive folder access (iOS, macOS) and the APNs token (iOS). Used only by the app in ../.."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TanookiCloudPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: TanookiCloudPlugin
        sharedDarwinSource: true
