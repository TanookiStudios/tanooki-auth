name: tanooki_cloud
description: "Tanooki Auth's own native bits: iCloud Drive folder access for sync (iOS, macOS), the APNs token (iOS), and the automatic-backup folder bookmark (iOS, macOS). Used only by the app in ../.."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.4
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TanookiCloudPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: TanookiCloudPlugin
        sharedDarwinSource: true
