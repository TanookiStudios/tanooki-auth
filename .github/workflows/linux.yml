name: Linux

# Real run on Ubuntu: unit tests, the end-to-end app test against a real Secret Service
# (gnome-keyring over libsecret, under a virtual screen), a release build, and .deb + AppImage.
on:
  push:
    branches: [main, platforms-day]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build and test packages
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libayatana-appindicator3-dev libjsoncpp-dev \
            xvfb dbus-x11 gnome-keyring libfuse2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: End-to-end app test (libsecret keyring, virtual screen)
        timeout-minutes: 15
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            echo -n itest | gnome-keyring-daemon --unlock --components=secrets
            xvfb-run -a flutter test integration_test/app_test.dart -d linux --dart-define=TA_STORAGE=itest
          '
      - run: flutter build linux --release
      - name: Package .deb and AppImage
        working-directory: .
        run: scripts/package-linux.sh
      - name: Install the .deb and check the app landed with all its libraries
        working-directory: dist
        run: |
          sudo apt-get install -y ./tanooki-auth_*_amd64.deb
          test -x /opt/tanooki-auth/tanooki-auth
          test -L /usr/bin/tanooki-auth
          test -f /usr/share/applications/com.tanookistudios.auth.desktop
          if ldd /opt/tanooki-auth/tanooki-auth | grep "not found"; then exit 1; fi
          echo "Installed: $(readlink -f /usr/bin/tanooki-auth)"
      - uses: actions/upload-artifact@v4
        with:
          name: tanooki-auth-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error
