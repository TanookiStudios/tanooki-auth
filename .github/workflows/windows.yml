name: Windows

# Real run on real Windows: unit tests, the end-to-end app test (DPAPI secure storage,
# vault on disk), and a release build uploaded as an artifact.
on:
  push:
    branches: [main, platforms-day]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter test integration_test/app_test.dart -d windows --dart-define=TA_STORAGE=itest
      # Tray icon, Quick pick copy, and Type code into a separate text box window.
      - run: flutter test integration_test/quick_pick_test.dart -d windows --dart-define=TA_STORAGE=itest
        timeout-minutes: 10
      - name: Quick pick test progress
        if: always()
        shell: pwsh
        run: Get-Content "$env:TEMP\ta_quickpick_log.txt" -ErrorAction SilentlyContinue
      - run: flutter build windows --release
      # Unsigned Store package; Partner Center signs it on upload. Identity comes from repo
      # variables once Maddie has them (store/microsoft-store.md); until then, pubspec placeholders.
      - name: Build Microsoft Store package (MSIX)
        shell: pwsh
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $a = @('--store', '--output-path', '..\dist', '--output-name', 'TanookiAuth')
          if ($env:MSIX_IDENTITY_NAME) { $a += '--identity-name', $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $a += '--publisher', $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $a += '--publisher-display-name', $env:MSIX_PUBLISHER_DISPLAY_NAME }
          dart run msix:create @a
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path ..\dist\TanookiAuth.msix))
          $entry = $zip.Entries | Where-Object FullName -eq 'AppxManifest.xml'
          $xml = [xml](New-Object IO.StreamReader($entry.Open())).ReadToEnd()
          $hasExe = $zip.Entries.FullName -contains 'TanookiAuth.exe'
          $zip.Dispose()
          if (-not $hasExe) { Write-Error 'TanookiAuth.exe is missing from the MSIX'; exit 1 }
          $id = $xml.Package.Identity
          Write-Host "MSIX identity: $($id.Name) $($id.Publisher) $($id.Version)"
          if (-not $id.Name -or -not $id.Version) { Write-Error 'MSIX has no identity'; exit 1 }
      - name: Build installer
        shell: pwsh
        working-directory: windows-installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $env:APP_VERSION = (Select-String -Path ../app/pubspec.yaml -Pattern '^version: ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc TanookiAuth.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install it silently and check the app landed
        shell: pwsh
        working-directory: dist
        run: |
          $setup = Get-ChildItem *.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $exe = "${env:ProgramFiles}\Tanooki Auth\TanookiAuth.exe"
          if (!(Test-Path $exe)) { Write-Error "installer did not place $exe"; exit 1 }
          Write-Host "Installed: $exe" 
      - uses: actions/upload-artifact@v4
        with:
          name: tanooki-auth-windows-setup
          path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: tanooki-auth-windows-msix
          path: dist/*.msix
          if-no-files-found: error
